name: DontLetMeSlouch
options:
  bundleIdPrefix: com.shivam
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.1"
    CURRENT_PROJECT_VERSION: "2"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""          # set your team in Xcode → Signing & Capabilities
targets:
  DontLetMeSlouch:
    type: application
    platform: macOS
    sources:
      - Engines.swift
      - Views.swift
      - Config.swift
      - Prefs.swift
      - main.swift
      - Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.shivam.posturemonitor
        PRODUCT_NAME: DontLetMeSlouch
        GENERATE_INFOPLIST_FILE: "YES"
        INFOPLIST_KEY_CFBundleDisplayName: "Don't Let Me Slouch"
        INFOPLIST_KEY_NSCameraUsageDescription: "Don't Let Me Slouch watches your sitting posture and gently nudges you when you slump. Video stays on your Mac."
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.healthcare-fitness
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: PostureMonitor.entitlements
        ENABLE_HARDENED_RUNTIME: "YES"
